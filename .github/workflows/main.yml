name: Deploy React App to SmarterASP

on:
  push:
    branches:
      - main   # change if you use master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: npm install

    # 4️⃣ Build React app
    - name: Build React app
      run: npm run build

    # ✅ Validate required FTP secrets
    - name: Validate FTP secrets
      run: |
        set -e
        if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "Missing GitHub secret: FTP_SERVER"; exit 1; fi
        if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "Missing GitHub secret: FTP_USERNAME"; exit 1; fi
        if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "Missing GitHub secret: FTP_PASSWORD"; exit 1; fi
        if [ -z "${{ secrets.FTP_PATH }}" ]; then echo "Missing GitHub secret: FTP_PATH"; exit 1; fi
        if [ ! -d "dist" ]; then echo "Build output folder 'dist' not found. Did build fail?"; exit 1; fi

    # 5️⃣ Deploy build folder to SmarterASP via FTP
    - name: Deploy to SmarterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: dist/
        server-dir: ${{ secrets.FTP_PATH }}/
        dangerous-clean-slate: true
